# Junction data-path configuration.
# Every key here is validated at startup; unknown keys are a hard error.

server:
  port: 8080
  admin_port: 9090            # bound from Phase 6
  backlog: 4096
  max_connections: 50000
  max_header_bytes: 16384     # exceeded -> 431
  max_uri_length: 8192        # exceeded -> 414
  max_body_bytes: 2147483647  # exceeded -> 413 (2 GiB, so the 1 GB gate streams)
  idle_timeout_ms: 60000      # idle client mid-request -> 408
  request_timeout_ms: 30000   # backend silent this long -> 504
  connect_timeout_ms: 1000    # cannot reach backend -> 502

pools:
  - name: api
    # p2c: near-optimal spread at O(1) with no shared state, and no herd
    # (see design.md §2.2). round_robin | least_connections | consistent_hash
    # are the alternatives; consistent_hash additionally needs hash_key.
    strategy: p2c
    health:
      path: /healthz
      interval_ms: 2000
      timeout_ms: 500         # must stay under interval_ms or probes stack up
      healthy_threshold: 2    # slow to trust
      unhealthy_threshold: 3  # slow to eject
    pool:
      max_idle_per_backend: 64
      max_connect_ms: 1000
      # Must be shorter than the backend's own keep-alive timeout, or the pool
      # hands out sockets the backend has already discarded.
      idle_ttl_ms: 30000
    backends:
      - { id: b1, host: backend-1, port: 8000, weight: 100 }
      - { id: b2, host: backend-2, port: 8000, weight: 100 }
      - { id: b3, host: backend-3, port: 8000, weight: 100 }

routes:
  - { host: "*", prefix: "/", pool: api }
