name: junction

# Phase 2 topology: the proxy in front of a three-backend pool with active
# health checking. Break one with:
#   docker compose exec backend-2 sh -c 'wget -qO- localhost:8000/_chaos/unhealthy'
# and watch traffic drain off it within a couple of probe intervals.
#
# `wrk` is behind the `load` profile so `docker compose up` stays lightweight.

services:
  backend-1: &backend
    build: .
    image: junction:latest
    environment:
      MAIN: io.junction.chaos.ChaosBackend
      BACKEND_PORT: "8000"
      BACKEND_ID: backend-1
    expose:
      - "8000"

  backend-2:
    <<: *backend
    environment:
      MAIN: io.junction.chaos.ChaosBackend
      BACKEND_PORT: "8000"
      BACKEND_ID: backend-2

  backend-3:
    <<: *backend
    environment:
      MAIN: io.junction.chaos.ChaosBackend
      BACKEND_PORT: "8000"
      BACKEND_ID: backend-3

  junction:
    build: .
    image: junction:latest
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    environment:
      MAIN: io.junction.Junction
      JUNCTION_CONFIG: /app/junction.yaml
    ports:
      - "8080:8080"

  # Load generator — `docker compose --profile load run --rm wrk`.
  wrk:
    image: williamyeh/wrk:latest
    profiles: ["load"]
    depends_on:
      - junction
    entrypoint: ["wrk"]
    command: ["-t4", "-c64", "-d15s", "--latency", "http://junction:8080/"]
